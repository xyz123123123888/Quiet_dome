plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "quiet_dome" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    // Loom adds essential repos automatically.
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Embedded FFmpeg (JavaCV), windows-x86_64 only; media extras excluded (~32MB total).
    def javacvLibs = [
        "org.bytedeco:javacv:1.5.14",
        "org.bytedeco:javacpp:1.5.14",
        "org.bytedeco:javacpp:1.5.14:windows-x86_64",
        "org.bytedeco:ffmpeg:8.1.2-1.5.14",
        "org.bytedeco:ffmpeg:8.1.2-1.5.14:windows-x86_64",
    ]
    javacvLibs.each { lib ->
        implementation(lib) { exclude group: 'org.bytedeco' }
        include(lib)
    }
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

// Keep the bundled videos out of the sources jar (they would triple its size).
tasks.named('sourcesJar', Jar) {
    exclude 'assets/quiet_dome/videos/**'
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
